<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIS-DF フラッシュカード | ServiceNow</title>
  <style>
    :root {
      --sn-purple:       #6B2D8B;
      --sn-purple-light: #8B3FB5;
      --sn-purple-dark:  #4A1F61;
      --sn-purple-pale:  #f5eeff;
      --sn-gray-bg:      #f0f0f0;
      --sn-gray-card:    #ffffff;
      --sn-gray-border:  #d0d0d7;
      --sn-gray-text:    #293949;
      --sn-gray-muted:   #606060;
      --sn-green:        #0a8f4d;
      --sn-green-pale:   #edfff5;
      --sn-red:          #c4001d;
      --sn-red-pale:     #fff0f2;
      --sn-blue:         #0054a6;
      --sn-yellow:       #e69900;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: var(--sn-gray-bg);
      color: var(--sn-gray-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--sn-purple-dark);
      color: #fff;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      position: sticky; top: 0; z-index: 100;
      flex-shrink: 0;
    }
    .logo { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
    .hdr-badge {
      background: var(--sn-purple-light);
      border-radius: 4px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .hdr-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .hdr-shortcut {
      background: rgba(255,255,255,.15);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    /* ── STAT BAR ── */
    .stat-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--sn-gray-muted);
    }
    .stat-item strong { color: var(--sn-gray-text); font-size: 15px; }
    .stat-sep { color: var(--sn-gray-border); }
    .progress-wrap {
      flex: 1;
      min-width: 140px;
      background: #d8d8e0;
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--sn-purple);
      height: 100%;
      border-radius: 99px;
      transition: width .35s ease;
    }
    .learned-badge {
      background: var(--sn-green-pale);
      color: var(--sn-green);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ── CATEGORY FILTER ── */
    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .cat-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid var(--sn-gray-border);
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: var(--sn-gray-muted);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .cat-btn:hover { border-color: var(--sn-purple-light); color: var(--sn-purple); }
    .cat-btn.active {
      background: var(--sn-purple);
      border-color: var(--sn-purple);
      color: #fff;
    }

    /* ── CARD AREA ── */
    .card-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 3-D flip container */
    .flip-wrap {
      width: 100%;
      max-width: 700px;
      height: 340px;
      perspective: 1200px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .flip-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.4,0,.2,1);
    }
    .flip-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      padding: 28px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    /* FRONT */
    .card-front {
      background: var(--sn-gray-card);
      border: 2px solid var(--sn-gray-border);
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card-front .face-hint {
      position: absolute;
      top: 14px; left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--sn-gray-muted);
      font-weight: 600;
    }
    .card-front .cat-tag {
      position: absolute;
      top: 12px; left: 16px;
      background: var(--sn-purple-dark);
      color: #fff;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .card-front .term-en {
      font-size: 28px;
      font-weight: 800;
      color: var(--sn-purple-dark);
      line-height: 1.25;
      margin-bottom: 10px;
    }
    .card-front .term-ja {
      font-size: 15px;
      color: var(--sn-gray-muted);
      font-weight: 500;
    }
    .card-front .flip-icon {
      position: absolute;
      bottom: 14px; right: 18px;
      font-size: 20px;
      color: var(--sn-gray-border);
    }

    /* BACK */
    .card-back {
      background: var(--sn-purple-dark);
      color: #fff;
      transform: rotateY(180deg);
      justify-content: flex-start;
      overflow-y: auto;
    }
    .card-back .face-hint {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,.5);
      font-weight: 600;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .card-back .def-text {
      font-size: 16px;
      line-height: 1.75;
      color: #fff;
      flex: 1;
    }
    .card-back .keyword-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
      flex-shrink: 0;
    }
    .keyword-chip {
      background: rgba(255,255,255,.18);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ── NAV CONTROLS ── */
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background .15s, opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: default; transform: none; }
    .btn-primary { background: var(--sn-purple); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--sn-purple-light); }
    .btn-secondary { background: #fff; color: var(--sn-purple); border: 2px solid var(--sn-purple); }
    .btn-secondary:hover:not(:disabled) { background: var(--sn-purple-pale); }
    .btn-green { background: var(--sn-green); color: #fff; }
    .btn-green:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: #fff; color: var(--sn-gray-muted); border: 2px solid var(--sn-gray-border); }
    .btn-ghost:hover { background: #f5f5f5; }
    .btn-danger { background: var(--sn-red-pale); color: var(--sn-red); border: 2px solid var(--sn-red); }
    .btn-danger:hover { background: #ffd9de; }

    /* ── KEYBOARD HINT ── */
    .kbd-hint {
      font-size: 12px;
      color: var(--sn-gray-muted);
      text-align: center;
    }
    kbd {
      display: inline-block;
      background: #e8e8ee;
      border: 1px solid #bbb;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 11px;
      font-family: monospace;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--sn-gray-muted);
    }
    .empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 20px; color: var(--sn-gray-text); margin-bottom: 8px; }

    /* ── COMPLETED STATE ── */
    .completed-state {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }
    .completed-state .big-emoji { font-size: 56px; margin-bottom: 16px; }
    .completed-state h2 { font-size: 24px; font-weight: 800; color: var(--sn-purple-dark); margin-bottom: 8px; }
    .completed-state p { color: var(--sn-gray-muted); font-size: 15px; margin-bottom: 24px; }
    .completed-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    @media (max-width: 600px) {
      .flip-wrap { height: 280px; }
      .card-face { padding: 20px; }
      .card-front .term-en { font-size: 22px; }
      .card-back .def-text { font-size: 14px; }
      .btn { padding: 9px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">ServiceNow</span>
  <span class="hdr-badge">CIS-DF フラッシュカード</span>
  <div class="hdr-right">
    <span class="hdr-shortcut">←→ 移動</span>
    <span class="hdr-shortcut">Space 裏返す</span>
    <span class="hdr-shortcut">Enter 覚えた</span>
  </div>
</header>

<main>

  <!-- STAT BAR -->
  <div class="stat-bar">
    <div class="stat-item">カード <strong id="pos-cur">1</strong> / <strong id="pos-tot">0</strong></div>
    <span class="stat-sep">|</span>
    <div class="stat-item">残り <strong id="pos-rem">0</strong> 枚</div>
    <div class="progress-wrap"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="learned-badge" id="learned-badge">覚えた 0枚</span>
  </div>

  <!-- CATEGORY FILTER -->
  <div class="cat-scroll" id="cat-scroll"></div>

  <!-- CARD AREA -->
  <div class="card-area" id="card-area">

    <div class="flip-wrap" id="flip-wrap" onclick="flipCard()">
      <div class="flip-inner" id="flip-inner">

        <div class="card-face card-front">
          <span class="face-hint">クリックまたはスペースキーで裏返す</span>
          <span class="cat-tag" id="front-cat"></span>
          <div class="term-en" id="front-term-en"></div>
          <div class="term-ja" id="front-term-ja"></div>
          <span class="flip-icon">↩</span>
        </div>

        <div class="card-face card-back">
          <div class="face-hint">定義・解説</div>
          <div class="def-text" id="back-def"></div>
          <div class="keyword-chips" id="back-chips"></div>
        </div>

      </div>
    </div>

    <!-- NAV CONTROLS -->
    <div class="nav-controls">
      <button class="btn btn-ghost" id="btn-prev" onclick="navigate(-1)">← 前へ</button>
      <button class="btn btn-ghost" onclick="shuffleDeck()">🔀 シャッフル</button>
      <button class="btn btn-secondary" onclick="flipCard()">↩ 裏返す</button>
      <button class="btn btn-green" id="btn-learned" onclick="markLearned()">✓ 覚えた！</button>
      <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">次へ →</button>
    </div>

    <div class="kbd-hint">
      <kbd>←</kbd><kbd>→</kbd> ナビゲーション &nbsp;
      <kbd>Space</kbd> 裏返す &nbsp;
      <kbd>Enter</kbd> 覚えた &nbsp;
      <kbd>R</kbd> リセット
    </div>

  </div>

  <!-- COMPLETED STATE -->
  <div class="completed-state" id="completed-state">
    <div class="big-emoji">🎉</div>
    <h2>全カード完了！</h2>
    <p id="completed-msg"></p>
    <div class="completed-actions">
      <button class="btn btn-primary" onclick="resetAll()">最初からやり直す</button>
      <button class="btn btn-secondary" onclick="resetLearned()">覚えたカードも含めてリセット</button>
    </div>
  </div>

</main>

<script>
// ============================================================
// カードデータ（114枚）
// ============================================================
const ALL_CARDS = [

  // ===== MID Server (14枚) =====
  { cat:"MID Server", en:"MID Server", ja:"MIDサーバー",
    def:"Management, Instrumentation, and Discovery Serverの略。ServiceNowインスタンスとネットワーク上のデバイス間の通信を仲介するJavaアプリケーション。ファイアウォールの内側にあるリソースへのアクセスを可能にする。",
    chips:["Java","ファイアウォール","仲介"] },

  { cat:"MID Server", en:"ECC Queue", ja:"ECCキュー（外部通信チャネルキュー）",
    def:"External Communication Channel Queueの略。ServiceNowインスタンスとMID Server間の非同期通信を管理するキュー。OutputレコードはSN→MIDへの指示、InputレコードはMID→SNへの応答を格納する。",
    chips:["Output","Input","非同期通信"] },

  { cat:"MID Server", en:"Validated (MID Server)", ja:"検証済みステータス",
    def:"管理者がMID Serverを正式に承認した状態。新しいMID Serverは自動的にValidatedにならず、ServiceNow管理画面から手動で検証・承認する必要がある。検証前はDiscoveryに使用できない。",
    chips:["承認","セキュリティ","管理者"] },

  { cat:"MID Server", en:"MID Server Cluster", ja:"MIDサーバークラスター",
    def:"同一ネットワークセグメント内の複数MID Serverをグループ化する機能。Discoveryの負荷を複数MID Serverに分散し、1台が停止しても他のMID Serverが処理を継続できる高可用性を実現する。",
    chips:["負荷分散","高可用性","フェイルオーバー"] },

  { cat:"MID Server", en:"Auto-upgrade", ja:"自動アップグレード",
    def:"ServiceNowインスタンスのバージョンアップ（例：Washington→Xanadu）に合わせて、接続されているMID Serverのソフトウェアを自動的に更新する機能。手動でのアップグレード作業が不要になる。",
    chips:["バージョン管理","自動化","保守"] },

  { cat:"MID Server", en:"IP Service", ja:"IPサービス（ポートスキャンサービス）",
    def:"MID ServerがDiscoveryのScanningフェーズでターゲットのIPアドレス範囲にTCP/UDPポートスキャンを実行するためのコンポーネント。スキャン結果をClassificationフェーズに渡す。",
    chips:["TCPスキャン","Scanning","ポート"] },

  { cat:"MID Server", en:"MID Server Extensions", ja:"MIDサーバー拡張機能",
    def:"MID Serverに追加のJARファイルや設定ファイルを配置して機能を拡張する仕組み。JDBCドライバの追加や独自プロトコルの対応など、標準では対応していない機能を追加できる。",
    chips:["JAR","JDBC","カスタム拡張"] },

  { cat:"MID Server", en:"config.xml", ja:"MIDサーバー設定ファイル",
    def:"MID Serverの動作を制御するXML設定ファイル。接続先ServiceNowインスタンスのURL、MID Serverユーザーの認証情報、プロキシ設定、JVMパラメータなどを定義する。",
    chips:["接続設定","認証情報","プロキシ"] },

  { cat:"MID Server", en:"agent.log", ja:"エージェントログファイル",
    def:"MID Serverの実行ログが記録されるファイル。起動エラー、通信エラー、Probe実行の詳細など、トラブルシューティング時に最初に確認するログファイル。デバッグレベルも設定可能。",
    chips:["ログ","トラブルシューティング","デバッグ"] },

  { cat:"MID Server", en:"MID Server Proxy Settings", ja:"プロキシ設定",
    def:"MID Serverが企業内プロキシサーバーを経由してServiceNowインスタンスに接続するための設定。config.xmlにプロキシホスト名、ポート、認証情報を記述して設定する。",
    chips:["プロキシ","config.xml","ネットワーク"] },

  { cat:"MID Server", en:"MID Server User", ja:"MIDサーバーユーザー",
    def:"ServiceNowインスタンス上でMID Serverが認証に使用する専用サービスアカウント。「mid_server」ロールが付与され、ECCキューの読み書きや各種APIへのアクセス権限を持つ。",
    chips:["サービスアカウント","mid_serverロール","認証"] },

  { cat:"MID Server", en:"MID Server Heartbeat", ja:"ハートビート",
    def:"MID ServerがServiceNowインスタンスに定期的に送信する生存確認メッセージ。デフォルトで約30秒ごとに送信され、一定時間ハートビートが途絶えるとMID ServerのステータスがDownになる。",
    chips:["死活監視","ステータス","定期通信"] },

  { cat:"MID Server", en:"MID Server Selection", ja:"MIDサーバー選択ルール",
    def:"Discovery Scheduleに複数のMID Serverが利用可能な場合に、どのMID Serverを使用するかを決定するルール。IPアドレス範囲、MID Server名、Clusterなどで選択条件を指定できる。",
    chips:["Discovery Schedule","ルール","割り当て"] },

  { cat:"MID Server", en:"ACC (Agent Client Collector)", ja:"エージェントクライアントコレクター",
    def:"MID Serverが直接到達できない環境（DMZ、リモートサイト、クラウド）にインストールするエージェント型のデータ収集コンポーネント。収集データをMID Server経由でServiceNowに送信する。",
    chips:["エージェント型","DMZ","クラウド"] },

  // ===== Discovery - Core (15枚) =====
  { cat:"Discovery", en:"Discovery", ja:"ディスカバリー",
    def:"ServiceNow ITOMの機能の一つ。ネットワーク上のデバイスやアプリケーションを自動的に検出し、その情報をCMDBのCIとして記録するプロセス。MID Serverを介して実行される。",
    chips:["ITOM","CMDB","自動検出"] },

  { cat:"Discovery", en:"Discovery Schedule", ja:"ディスカバリースケジュール",
    def:"Discoveryを実行するための設定オブジェクト。対象IPアドレス範囲、使用するMID Server、実行頻度（スケジュール）、使用するCredential、Throttle設定などを定義する。",
    chips:["IP範囲","スケジュール","MID Server"] },

  { cat:"Discovery", en:"Scanning Phase", ja:"スキャンフェーズ",
    def:"Discoveryの第1フェーズ。指定されたIPアドレス範囲に対してICMP（ping）やTCPポートスキャンを実行し、応答があったデバイスを発見する。発見したデバイスを次のClassificationフェーズに渡す。",
    chips:["第1フェーズ","ICMP","TCPポートスキャン"] },

  { cat:"Discovery", en:"Classification Phase", ja:"クラシフィケーションフェーズ",
    def:"Discoveryの第2フェーズ。Scanningで発見されたデバイスのOSタイプ（Windows、Linux、ネットワーク機器など）を特定する。特定したOS情報を基にExplorationフェーズの手法を決定する。",
    chips:["第2フェーズ","OSタイプ特定","デバイス分類"] },

  { cat:"Discovery", en:"Identification Phase", ja:"アイデンティフィケーションフェーズ",
    def:"Discoveryの第3フェーズ。IRE（Identification and Reconciliation Engine）を使用して、発見されたCIがCMDB上の既存レコードと同一かどうかを判断する。重複作成を防ぐ重要なフェーズ。",
    chips:["第3フェーズ","IRE","重複防止"] },

  { cat:"Discovery", en:"Exploration Phase", ja:"エクスプロレーションフェーズ",
    def:"Discoveryの第4フェーズ。Classificationで特定されたOSタイプに応じたProbeを実行し、インストール済みソフトウェア、実行中プロセス、ハードウェア情報などの詳細データを収集する。",
    chips:["第4フェーズ","Probe実行","詳細情報収集"] },

  { cat:"Discovery", en:"Horizontal Discovery", ja:"ホリゾンタルディスカバリー",
    def:"従来のIPスキャンベースのDiscovery手法。IPアドレス範囲をスキャンして個々のデバイス・CIを発見する。CI単体の発見に特化しており、CI間のリレーション（依存関係）は発見しない。",
    chips:["IPスキャン","CI単体","オンプレミス"] },

  { cat:"Discovery", en:"Quick Discovery", ja:"クイックディスカバリー",
    def:"特定の単一IPアドレスまたはホスト名を指定して即座に実行できる単発Discoveryの機能。定期スケジュールとは別に、特定デバイスのCI更新やトラブルシューティング時に使用する。",
    chips:["単発実行","即時","トラブルシューティング"] },

  { cat:"Discovery", en:"Throttle", ja:"スロットル（同時実行制限）",
    def:"MID ServerがDiscovery中に同時に実行できるProbeの最大数を制限する設定。ネットワーク帯域やターゲットデバイスへの負荷を軽減し、本番環境への影響を最小化するために使用する。",

// ============================================================
// アプリ状態
// ============================================================
let activeCat     = "すべて";
let learnedIds    = new Set();   // インデックス（全体）
let deck          = [];          // 現在表示中のカードリスト（インデックス）
let deckPos       = 0;
let isFlipped     = false;

const cats = ["すべて", ...Array.from(new Set(ALL_CARDS.map(c => c.cat)))];

// ============================================================
// 初期化
// ============================================================
window.onload = () => {
  buildCatButtons();
  buildDeck();
  renderCard();
};

function buildCatButtons() {
  const wrap = document.getElementById("cat-scroll");
  cats.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === activeCat ? " active" : "");
    const count = cat === "すべて"
      ? ALL_CARDS.length
      : ALL_CARDS.filter(c => c.cat === cat).length;
    btn.textContent = `${cat} (${count})`;
    btn.onclick = () => selectCat(cat);
    wrap.appendChild(btn);
  });
}

function selectCat(cat) {
  activeCat = cat;
  document.querySelectorAll(".cat-btn").forEach((b, i) => {
    b.classList.toggle("active", cats[i] === cat);
  });
  buildDeck();
  renderCard();
}

function buildDeck() {
  const filtered = ALL_CARDS
    .map((c, i) => i)
    .filter(i => activeCat === "すべて" || ALL_CARDS[i].cat === activeCat)
    .filter(i => !learnedIds.has(i));
  deck = filtered;
  deckPos = 0;
}

// ============================================================
// 描画
// ============================================================
function renderCard() {
  const learnedInCat = activeCat === "すべて"
    ? learnedIds.size
    : Array.from(learnedIds).filter(i => ALL_CARDS[i].cat === activeCat).length;
  const totalInCat   = activeCat === "すべて"
    ? ALL_CARDS.length
    : ALL_CARDS.filter(c => c.cat === activeCat).length;

  document.getElementById("learned-badge").textContent = `覚えた ${learnedInCat}枚`;
  document.getElementById("pos-rem").textContent = deck.length;

  if (deck.length === 0) {
    document.getElementById("flip-wrap").style.display  = "none";
    document.getElementById("completed-state").style.display = "block";
    document.querySelector(".nav-controls").style.display = "none";
    document.querySelector(".kbd-hint").style.display   = "none";
    document.getElementById("completed-msg").textContent =
      `${activeCat === "すべて" ? "全カテゴリ" : activeCat} の全 ${totalInCat} 枚を覚えました！`;
    updateProgress(totalInCat, totalInCat);
    return;
  }

  document.getElementById("flip-wrap").style.display  = "";
  document.getElementById("completed-state").style.display = "none";
  document.querySelector(".nav-controls").style.display = "flex";
  document.querySelector(".kbd-hint").style.display   = "";

  const idx  = deck[deckPos];
  const card = ALL_CARDS[idx];

  document.getElementById("pos-cur").textContent = deckPos + 1;
  document.getElementById("pos-tot").textContent = deck.length;

  document.getElementById("front-cat").textContent    = card.cat;
  document.getElementById("front-term-en").textContent = card.en;
  document.getElementById("front-term-ja").textContent = card.ja;
  document.getElementById("back-def").textContent     = card.def;

  const chipsEl = document.getElementById("back-chips");
  chipsEl.innerHTML = "";
  (card.chips || []).forEach(ch => {
    const span = document.createElement("span");
    span.className = "keyword-chip";
    span.textContent = ch;
    chipsEl.appendChild(span);
  });

  // ボタン
  document.getElementById("btn-prev").disabled = deckPos === 0;
  document.getElementById("btn-next").disabled = deckPos === deck.length - 1;

  // カードを表に戻す
  if (isFlipped) flipCard();

  updateProgress(learnedInCat, totalInCat);
}

function updateProgress(learned, total) {
  const pct = total === 0 ? 100 : Math.round((learned / total) * 100);
  document.getElementById("prog-fill").style.width = pct + "%";
}

// ============================================================
// カード操作
// ============================================================
function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById("flip-inner").classList.toggle("flipped", isFlipped);
}

function navigate(dir) {
  const newPos = deckPos + dir;
  if (newPos < 0 || newPos >= deck.length) return;
  deckPos = newPos;
  isFlipped = false;
  renderCard();
}

function markLearned() {
  if (deck.length === 0) return;
  const idx = deck[deckPos];
  learnedIds.add(idx);
  deck.splice(deckPos, 1);
  if (deckPos >= deck.length) deckPos = Math.max(0, deck.length - 1);
  isFlipped = false;
  renderCard();
}

function shuffleDeck() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  deckPos  = 0;
  isFlipped = false;
  renderCard();
}

// 覚えたリセット（現カテゴリのみ）
function resetAll() {
  const toReset = activeCat === "すべて"
    ? Array.from({length: ALL_CARDS.length}, (_, i) => i)
    : ALL_CARDS.map((c, i) => i).filter(i => ALL_CARDS[i].cat === activeCat);
  toReset.forEach(i => learnedIds.delete(i));
  buildDeck();
  isFlipped = false;
  renderCard();
}

// 全カテゴリを含めてリセット
function resetLearned() {
  learnedIds.clear();
  buildDeck();
  isFlipped = false;
  renderCard();
}

// ============================================================
// キーボードショートカット
// ============================================================
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  switch(e.key) {
    case "ArrowRight": case "l": navigate(1);       e.preventDefault(); break;
    case "ArrowLeft":  case "h": navigate(-1);      e.preventDefault(); break;
    case " ": flipCard();         e.preventDefault(); break;
    case "Enter": markLearned();  e.preventDefault(); break;
    case "r": case "R": resetAll(); break;
    case "s": case "S": shuffleDeck(); break;
  }
});
</script>
