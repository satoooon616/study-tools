<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#4A1E24"/>
  <title>ワインエキスパート フラッシュカード</title>
  <style>
    :root{
      --w-red:#722F37; --w-red-l:#9B4B57; --w-red-d:#4A1E24;
      --w-gold:#C9A94B; --w-gold-l:#F0D080; --w-gold-pale:#FDF6E3;
      --w-bg:#F8F2EA; --w-card:#FFFFFF;
      --w-border:#D9C4A0; --w-text:#2C1810; --w-muted:#7A5C4A;
      --w-green:#2E7D32; --w-blue:#1565C0;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"Helvetica Neue",Arial,sans-serif;background:var(--w-bg);color:var(--w-text);min-height:100vh;display:flex;flex-direction:column;}

    header{background:var(--w-red-d);color:#fff;height:56px;padding:0 24px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.35);position:sticky;top:0;z-index:100;}
    .logo{font-size:19px;font-weight:700;letter-spacing:.5px;}
    .logo span{color:var(--w-gold-l);}
    .hdr-badge{background:var(--w-red-l);border-radius:4px;padding:2px 10px;font-size:12px;font-weight:600;}
    .hdr-right{margin-left:auto;display:flex;gap:8px;}
    .hdr-key{background:rgba(255,255,255,.15);border-radius:4px;padding:2px 8px;font-size:11px;}

    main{flex:1;max-width:920px;width:100%;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:18px;}

    /* STAT BAR */
    .stat-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .stat-item{font-size:13px;color:var(--w-muted);}
    .stat-item strong{color:var(--w-text);font-size:15px;}
    .prog-wrap{flex:1;min-width:120px;background:#E0D0BC;border-radius:99px;height:6px;overflow:hidden;}
    .prog-fill{background:var(--w-gold);height:100%;border-radius:99px;transition:width .35s ease;}
    .learned-badge{background:#EDFFF5;color:var(--w-green);border-radius:4px;padding:3px 10px;font-size:12px;font-weight:700;}

    /* CATEGORY FILTER */
    .cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;}
    .cat-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:2px solid var(--w-border);background:#fff;font-size:13px;font-weight:600;color:var(--w-muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
    .cat-btn:hover{border-color:var(--w-red-l);color:var(--w-red);}
    .cat-btn.active{background:var(--w-red);border-color:var(--w-red);color:#fff;}

    /* FLIP CARD */
    .flip-wrap{width:100%;max-width:720px;margin:0 auto;height:380px;perspective:1200px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
    .flip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
    .flip-inner.flipped{transform:rotateY(180deg);}
    .card-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;box-shadow:0 4px 24px rgba(74,30,36,.15);}

    /* FRONT */
    .card-front{background:var(--w-card);border:2px solid var(--w-border);justify-content:center;align-items:center;text-align:center;padding:28px 36px;}
    .face-hint-top{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--w-border);font-weight:600;}
    .cat-tag{position:absolute;top:12px;left:16px;background:var(--w-red-d);color:#fff;border-radius:4px;padding:2px 9px;font-size:11px;font-weight:600;}
    .term-en{font-size:30px;font-weight:800;color:var(--w-red-d);line-height:1.2;margin-bottom:10px;}
    .term-ja{font-size:16px;color:var(--w-muted);font-weight:500;}
    .grape-icon{position:absolute;bottom:14px;right:18px;font-size:22px;opacity:.3;}

    /* BACK */
    .card-back{background:var(--w-red-d);color:#fff;transform:rotateY(180deg);padding:22px 26px;overflow-y:auto;flex-direction:row;gap:16px;}
    .back-left{flex:1;display:flex;flex-direction:column;gap:10px;}
    .back-face-hint{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.45);font-weight:600;flex-shrink:0;}
    .def-text{font-size:14px;line-height:1.75;color:#fff;flex:1;}
    .kw-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
    .kw-chip{background:rgba(255,255,255,.15);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;color:rgba(255,255,255,.9);}
    .back-map{flex-shrink:0;width:200px;display:flex;align-items:center;justify-content:center;}
    @media(max-width:600px){
      /* カード裏面：縦並びに */
      .card-back{flex-direction:column;padding:16px 18px;}
      .back-map{width:100%;max-height:160px;justify-content:center;}

      /* カードの高さ（positionはabsoluteのまま維持してflipを正常動作させる） */
      .flip-wrap{height:360px;}
      .flip-inner{height:360px;}
    }

    /* NAV */
    .nav-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
    .btn{padding:10px 20px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;}
    .btn:active{transform:scale(.97);}
    .btn:disabled{opacity:.35;cursor:default;transform:none;}
    .btn-primary{background:var(--w-red);color:#fff;}
    .btn-primary:hover:not(:disabled){background:var(--w-red-l);}
    .btn-secondary{background:#fff;color:var(--w-red);border:2px solid var(--w-red);}
    .btn-secondary:hover:not(:disabled){background:#FFF0F2;}
    .btn-green{background:var(--w-green);color:#fff;}
    .btn-green:hover:not(:disabled){opacity:.88;}
    .btn-ghost{background:#fff;color:var(--w-muted);border:2px solid var(--w-border);}
    .btn-ghost:hover{background:#f5f0e8;}
    .kbd-hint{font-size:12px;color:var(--w-muted);text-align:center;}
    kbd{display:inline-block;background:#e8e0d8;border:1px solid #c0b0a0;border-radius:3px;padding:1px 6px;font-size:11px;font-family:monospace;}

    /* COMPLETED */
    .completed-state{display:none;text-align:center;padding:48px 24px;}
    .completed-state .big-emoji{font-size:52px;margin-bottom:16px;}
    .completed-state h2{font-size:22px;font-weight:800;color:var(--w-red-d);margin-bottom:8px;}
    .completed-state p{color:var(--w-muted);margin-bottom:24px;}
    .completed-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

    /* ===== MOBILE ===== */
    @media(max-width:600px){
      /* ヘッダー：キーボードヒントを非表示、コンパクトに */
      header{padding:0 14px;height:48px;}
      .logo{font-size:16px;}
      .hdr-badge{font-size:11px;padding:2px 8px;}
      .hdr-right{display:none;}

      /* メイン */
      main{padding:14px 12px 32px;gap:14px;}

      /* ステータスバー */
      .stat-bar{gap:8px;}
      .stat-item{font-size:12px;}
      .stat-item strong{font-size:13px;}
      .learned-badge{font-size:11px;padding:2px 8px;}

      /* カテゴリボタン */
      .cat-btn{padding:5px 12px;font-size:12px;}

      /* カード表面 */
      .card-front{padding:20px 18px;}
      .term-en{font-size:22px;}
      .term-ja{font-size:14px;}
      .face-hint-top{font-size:10px;}

      /* カード裏面 */
      .def-text{font-size:13px;line-height:1.65;}
      .back-face-hint{font-size:10px;}
      .kw-chip{font-size:10px;}

      /* ナビゲーションボタン：スマホ向け2×2グリッド */
      .nav-controls{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        width:100%;
        max-width:480px;
        margin:0 auto;
      }
      /* 裏返す と 覚えた は2列グリッドの1行目 */
      #btn-prev{order:1;}
      #btn-next{order:2;}
      .btn-secondary{order:3;}  /* 裏返す */
      .btn-green{order:4;}      /* 覚えた */
      /* シャッフルボタンは全幅で最下部 */
      .nav-controls .btn-ghost:not(#btn-prev):not(#btn-next){
        order:5;
        grid-column:1/-1;
        font-size:12px;
        padding:9px;
        color:var(--w-muted);
      }
      .btn{padding:13px 10px;font-size:14px;border-radius:6px;width:100%;}
      #btn-prev,#btn-next{font-size:15px;padding:14px 8px;}

      /* キーボードヒント非表示 */
      .kbd-hint{display:none;}

      /* 完了画面 */
      .completed-state{padding:32px 16px;}
      .completed-actions{flex-direction:column;}
      .completed-actions .btn{width:100%;padding:14px;}
    }

    /* 極小画面(〜380px) */
    @media(max-width:380px){
      .term-en{font-size:19px;}
      .flip-wrap{height:320px;}
      .flip-inner{height:320px;}
      .btn{font-size:13px;padding:12px 6px;}
    }
  </style>
</head>
<body>
<header>
  <span class="logo">🍷 <span>Wine</span> Expert</span>
  <span class="hdr-badge">フラッシュカード</span>
  <div class="hdr-right">
    <span class="hdr-key">←→ 移動</span>
    <span class="hdr-key">Space 裏返す</span>
    <span class="hdr-key">Enter 覚えた</span>
  </div>
</header>

<main>
  <div class="stat-bar">
    <div class="stat-item">カード <strong id="pos-cur">1</strong> / <strong id="pos-tot">0</strong></div>
    <span style="color:var(--w-border)">|</span>
    <div class="stat-item">残り <strong id="pos-rem">0</strong> 枚</div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <span class="learned-badge" id="learned-badge">覚えた 0枚</span>
  </div>

  <div class="cat-scroll" id="cat-scroll"></div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <div class="flip-wrap" id="flip-wrap" onclick="flipCard()">
      <div class="flip-inner" id="flip-inner">
        <div class="card-face card-front">
          <span class="face-hint-top">クリックまたはSpaceで裏返す</span>
          <span class="cat-tag" id="front-cat"></span>
          <div class="term-en" id="front-en"></div>
          <div class="term-ja" id="front-ja"></div>
          <span class="grape-icon">🍇</span>
        </div>
        <div class="card-face card-back" id="card-back">
          <div class="back-left">
            <div class="back-face-hint">定義・解説</div>
            <div class="def-text" id="back-def"></div>
            <div class="kw-chips" id="back-chips"></div>
          </div>
          <div class="back-map" id="back-map"></div>
        </div>
      </div>
    </div>

    <div class="nav-controls">
      <button class="btn btn-ghost" id="btn-prev" onclick="navigate(-1)">← 前へ</button>
      <button class="btn btn-ghost" onclick="shuffleDeck()">🔀 シャッフル</button>
      <button class="btn btn-secondary" onclick="flipCard()">↩ 裏返す</button>
      <button class="btn btn-green" onclick="markLearned()">✓ 覚えた！</button>
      <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">次へ →</button>
    </div>
    <div class="kbd-hint"><kbd>←</kbd><kbd>→</kbd> 移動 &nbsp;<kbd>Space</kbd> 裏返す &nbsp;<kbd>Enter</kbd> 覚えた &nbsp;<kbd>S</kbd> シャッフル &nbsp;<kbd>R</kbd> リセット</div>
  </div>

  <div class="completed-state" id="completed-state">
    <div class="big-emoji">🥂</div>
    <h2>全カード完了！</h2>
    <p id="completed-msg"></p>
    <div class="completed-actions">
      <button class="btn btn-primary" onclick="resetAll()">もう一度</button>
      <button class="btn btn-ghost" onclick="resetLearned()">全リセット</button>
    </div>
  </div>
</main>

{cat:"ボルドー",en:"Pétrus",ja:"ペトリュス",
 def:"ポムロールを代表する幻のワイン。約11.5haの畑でメルロ100%から造られる。格付けは受けていないが世界最高価格ワインの一つ。特殊なブールー粘土質土壌が個性の源。",
 chips:["ポムロール","Merlot100%","非格付け","高価"],map:null},

// ===== ブルゴーニュ =====
{cat:"ブルゴーニュ",en:"Burgundy Hierarchy",ja:"ブルゴーニュ品質ピラミッド",
 def:"4段階の品質ピラミッド：①グラン・クリュ（特級畑、最上位）②プルミエ・クリュ（一級畑）③村名（ヴィラージュ）AOC ④地域名（レジョナル）AOC。上位ほど畑面積が小さく生産量が少ない。",
 chips:["グラン・クリュ","プルミエ・クリュ","畑格付け"],map:"hierarchy_burgundy"},

{cat:"ブルゴーニュ",en:"Côte de Nuits",ja:"コート・ド・ニュイ",
 def:"ブルゴーニュのコート・ドールの北半分。ジュヴレ・シャンベルタン、モレ・サン・ドニ、シャンボール・ミュジニー、ヴォーヌ・ロマネ、ニュイ・サン・ジョルジュなどを擁する。ピノ・ノワール最高峰産地。",
 chips:["ピノ・ノワール","ジュヴレ","ヴォーヌ・ロマネ"],map:"burgundy"},

{cat:"ブルゴーニュ",en:"Côte de Beaune",ja:"コート・ド・ボーヌ",
 def:"コート・ドールの南半分。アロース・コルトン、ボーヌ、ポマール、ヴォルネイ（赤）、ムルソー、ピュリニー・モンラッシェ、シャサーニュ・モンラッシェ（白）などを含む。シャルドネの銘醸地。",
 chips:["シャルドネ","ムルソー","モンラッシェ"],map:"burgundy"},

{cat:"ブルゴーニュ",en:"Romanée-Conti (DRC)",ja:"ロマネ・コンティ",
 def:"ヴォーヌ・ロマネ村にある1.8haのモノポール（単独所有畑）。ドメーヌ・ド・ラ・ロマネ・コンティ（DRC）が所有。ピノ・ノワール100%。世界で最も高価なワインの一つ。",
 chips:["モノポール","DRC","ヴォーヌ・ロマネ","世界最高峰"],map:null},

{cat:"ブルゴーニュ",en:"Chablis",ja:"シャブリ",
 def:"ブルゴーニュ北部の白ワイン産地。キンメリジャン土壌（牡蠣殻を含む石灰質泥灰土）でシャルドネを栽培。樽を使わず造られるスタイルが多く、ミネラル感と鋭い酸が特徴。グラン・クリュは7つ。",
 chips:["キンメリジャン","シャルドネ","ミネラル","無樽"],map:"burgundy"},

{cat:"ブルゴーニュ",en:"Climat / Lieu-dit",ja:"クリマ・リュー・ディ",
 def:"ブルゴーニュ特有の概念。クリマ（Climat）は地形・土壌・微気候が均一な個別の畑区画の名称。リュー・ディは地名。2015年ユネスコ世界遺産登録。これによりブドウ産地の細かい格差が表現される。",
 chips:["テロワール","世界遺産","畑名","区画"],map:null},

{cat:"ブルゴーニュ",en:"Négociant / Domaine",ja:"ネゴシアン・ドメーヌ",
 def:"ネゴシアン：生産者からブドウや醸造酒を買い取りブレンド・瓶詰めする商社。ルイ・ジャドなど。ドメーヌ：自社畑のブドウのみで醸造。コープ：農協系。どちらが上質かは一概に言えない。",
 chips:["ネゴシアン","ドメーヌ","流通","買いブドウ"],map:null},

// ===== シャンパーニュ =====
{cat:"シャンパーニュ",en:"Champagne",ja:"シャンパーニュ",
 def:"フランス北東部の発泡性ワイン産地。瓶内二次発酵（méthode champenoise）で造られるものだけが「シャンパン」を名乗れる。主要品種：ピノ・ノワール、シャルドネ、ピノ・ムニエ。中心都市はランスとエペルネ。",
 chips:["瓶内二次発酵","ランス","エペルネ","AOC"],map:"champagne"},

{cat:"シャンパーニュ",en:"Méthode Champenoise",ja:"シャンパーニュ方式（瓶内二次発酵）",
 def:"①一次発酵→②ティラージュ（リキュールと酵母を加え打栓）→③瓶内二次発酵（炭酸生成）→④熟成（澱と接触）→⑤ルミアージュ（澱を集める）→⑥デゴルジュマン（澱を除去）→⑦ドサージュ（甘さ調整）→最終打栓。",
 chips:["二次発酵","ルミアージュ","デゴルジュマン","ドサージュ"],map:null},

{cat:"シャンパーニュ",en:"Blanc de Blancs / Blanc de Noirs",ja:"ブラン・ド・ブラン / ブラン・ド・ノワール",
 def:"Blanc de Blancs：白ブドウ（シャルドネ）のみで造る白スパークリング。繊細・柑橘系。Blanc de Noirs：黒ブドウ（ピノ・ノワール/ムニエ）を白ワイン製法で造る白（果皮を長時間接触させない）。",
 chips:["シャルドネ","ピノ・ノワール","製法","色の違い"],map:null},

{cat:"シャンパーニュ",en:"Dosage (Liqueur d'expédition)",ja:"ドサージュ（門出のリキュール）",
 def:"デゴルジュマン後にワインの目減り分を補うため加える甘さ調整液（ワイン＋砂糖）。甘さによる分類：Brut Nature（無添加）＜ Extra Brut ＜ Brut ＜ Extra Dry ＜ Sec ＜ Demi-Sec ＜ Doux。",
 chips:["甘さ調整","Brut","残糖","デゴルジュマン後"],map:null},

{cat:"シャンパーニュ",en:"Non-vintage (NV) / Vintage",ja:"ノンヴィンテージ / ヴィンテージシャンパン",
 def:"NV：複数年のワインをブレンドし、一定の品質・スタイルを維持したもの。ハウスのフラッグシップ。Vintage：特別に優れた年のみ収穫年を表示して造る。より深みがあり長熟に向く。最低3年以上熟成必須。",
 chips:["ブレンド","複数年","単一年","熟成"],map:null},

{cat:"シャンパーニュ",en:"Prestige Cuvée",ja:"プレステージ・キュヴェ",
 def:"各メゾン（シャンパーニュハウス）の最上位ブランド。例：モエ＆シャンドンの「ドン・ペリニヨン」、クリュッグの「クリュッグ グラン・キュヴェ」、ルイ・ロデレールの「クリスタル」。セラーマスターの技術の結晶。",
 chips:["ドン・ペリニヨン","クリスタル","最上位","各ハウス"],map:null},

{cat:"シャンパーニュ",en:"Grand Cru / Premier Cru in Champagne",ja:"シャンパーニュのグラン・クリュ・プルミエ・クリュ",
 def:"シャンパーニュではエシェル・デ・クリュ（cru格付けスケール）でビレッジを100点満点で評価。100点がグラン・クリュ（17村）、90〜99点がプルミエ・クリュ（44村）。ブルゴーニュとは意味が異なる。",
 chips:["エシェル・デ・クリュ","17村","格付け","村単位"],map:null},

// ===== ローヌ =====
{cat:"ローヌ",en:"Côte-Rôtie",ja:"コート・ロティ",
 def:"北ローヌ最北端の急斜面AOC。シラー100%（最大20%ヴィオニエ混醸可）。急傾斜の花崗岩土壌（ブリュンとブロンドの丘）。フィネスと胡椒・スミレのアロマ。主要生産者：ギガル、ジャメ。",
 chips:["シラー","急斜面","花崗岩","胡椒"],map:"rhone"},

{cat:"ローヌ",en:"Châteauneuf-du-Pape",ja:"シャトーヌフ・デュ・パプ",
 def:"南ローヌ最高峰AOC。13品種ブレンド可（グルナッシュ主体）。大きな丸石（ガレ・ルーレ）が特徴的な土壌で昼間の熱を蓄え夜間放出。アルコール度が高くボディ豊か。白も生産。",
 chips:["グルナッシュ","ガレ・ルーレ","南ローヌ","高アルコール"],map:"rhone"},

{cat:"ローヌ",en:"GSM Blend",ja:"GSMブレンド",
 def:"Grenache（グルナッシュ）＋Syrah（シラー）＋Mourvèdre（ムールヴェードル）の頭文字。南ローヌ・プロヴァンス・スペイン（Garnacha/Monastrell）・オーストラリアなどで広く用いられるブレンド。",
 chips:["グルナッシュ","シラー","ムールヴェードル","南フランス"],map:null},

// ===== ロワール =====
{cat:"ロワール",en:"Loire Valley",ja:"ロワール渓谷",
 def:"フランス最長のロワール川沿いに広がる多様な産地。西から：ペイ・ナンテ（ミュスカデ）、アンジュー（シュナン・ブラン）、トゥーレーヌ、サントル（サンセール、プイィ・フュメ）。",
 chips:["ミュスカデ","シュナン・ブラン","ソーヴィニヨン・ブラン","多様"],map:null},

{cat:"ロワール",en:"Sancerre / Pouilly-Fumé",ja:"サンセール / プイィ・フュメ",
 def:"ロワール中央部のソーヴィニヨン・ブラン2大銘醸地。サンセール（左岸）とプイィ・フュメ（右岸）が対岸に位置。石灰質土壌から生まれるハーブ・柑橘・ミネラル香の辛口白。",
 chips:["ソーヴィニヨン・ブラン","石灰質","辛口","ミネラル"],map:null},

{cat:"ロワール",en:"Vouvray",ja:"ヴーヴレ",
 def:"ロワール・トゥーレーヌ地区のシュナン・ブラン（地元名：ピノー・ドラ・ロワール）のみで造るAOC。辛口から極甘口（VT、SGN）まで幅広いスタイル。スパークリングも製造。高い酸で長期熟成に向く。",
 chips:["シュナン・ブラン","辛口〜甘口","長期熟成","スパークリング"],map:null},

// ===== アルザス =====
{cat:"アルザス",en:"Alsace",ja:"アルザス",
 def:"フランス北東部・ドイツ国境のライン川沿い産地。ドイツ的気候だが辛口志向（例外：ヴァンダンジュ・タルディヴ/セレクション・グラン・ノーブル）。品種名をラベルに表示（フランス唯一）。細長い瓶（フルート型）が特徴。",
 chips:["辛口","品種名表示","フルート瓶","ドイツ国境"],map:"france"},

{cat:"アルザス",en:"Vendanges Tardives / SGN",ja:"ヴァンダンジュ・タルディヴ / セレクション・グラン・ノーブル",
 def:"VT：遅摘み甘口。SGN（Sélection de Grains Nobles）：貴腐果を粒選りした最甘口。どちらもリースリング・ゲヴュルツトラミネール・ピノ・グリ・ミュスカのいずれかで造られる。",
 chips:["遅摘み","貴腐","甘口","リースリング"],map:null},

// ===== イタリア =====
{cat:"イタリア",en:"Italy Overview",ja:"イタリアワイン概要",
 def:"生産量・品質ともに世界トップレベル。DOCGが78、DOCが341と細かく規制。北部（ピエモンテ、ヴェネト）から南部（プーリア、シチリア）まで多様な品種・スタイル。固有品種の宝庫。",
 chips:["DOCG","DOC","固有品種","南北多様"],map:"italy"},

{cat:"イタリア",en:"Barolo",ja:"バローロ",
 def:"ピエモンテ州・ランゲ丘陵のネッビオーロ100%の赤ワイン。「ワインの王」とも称される。重厚なタンニンと高い酸が特徴。DOCG。最低熟成期間：通常38ヶ月（うち樽18ヶ月）、リゼルヴァは62ヶ月。",
 chips:["ネッビオーロ","ピエモンテ","王のワイン","長期熟成"],map:"italy"},

{cat:"イタリア",en:"Barbaresco",ja:"バルバレスコ",
 def:"バローロと同じネッビオーロ100%。バローロより少し優しくエレガントなスタイル（「女王のワイン」）。DOCG。最低熟成：26ヶ月（うち樽9ヶ月）。ガヤが世界的に名を広めた。",
 chips:["ネッビオーロ","女王のワイン","ガヤ","エレガント"],map:null},

{cat:"イタリア",en:"Chianti Classico",ja:"キャンティ・クラシコ",
 def:"トスカーナ・フィレンツェとシエナの間の歴史的中心地区のサンジョヴェーゼ主体赤。DOCG。黒鶏（Gallo Nero）マークが品質の証。アンナータ、リゼルヴァ、グラン・セレツィオーネの3ランク。",
 chips:["サンジョヴェーゼ","黒鶏","トスカーナ","DOCG"],map:null},

{cat:"イタリア",en:"Brunello di Montalcino",ja:"ブルネッロ・ディ・モンタルチーノ",
 def:"トスカーナ・モンタルチーノ村のサンジョヴェーゼ・グロッソ（ブルネッロ）100%。最長熟成義務（最低5年、うち樽2年）を持つイタリア最高峰の一つ。DOCG。",
 chips:["サンジョヴェーゼ・グロッソ","5年熟成","モンタルチーノ","DOCG"],map:null},

{cat:"イタリア",en:"Super Tuscans",ja:"スーパータスカン",
 def:"DOC規則に縛られず、カベルネ・ソーヴィニヨンやメルロなどの国際品種をブレンドしたトスカーナの革新的ワイン群。当初はテーブルワイン扱いだったが品質で世界を席巻。サッシカイア、オルネッライア、ティニャネッロが代表。",
 chips:["国際品種","規則外","サッシカイア","革新"],map:null},

{cat:"イタリア",en:"Amarone della Valpolicella",ja:"アマローネ・デッラ・ヴァルポリチェッラ",
 def:"ヴェネト州・ヴェローナ郊外のアパッシメント（陰干し）製法のワイン。コルヴィーナなどの黒ブドウを3〜4ヶ月乾燥させ糖度を凝縮。高アルコール（15〜17%）で凝縮した果実味。DOCG。",
 chips:["アパッシメント","陰干し","コルヴィーナ","高アルコール"],map:null},

{cat:"イタリア",en:"Prosecco",ja:"プロセッコ",
 def:"ヴェネト州・フリウリのグレーラ種から造るイタリアのスパークリングワイン。シャルマ法（タンク内二次発酵）で製造。フレッシュな洋梨・白桃の香り。DOCとDOCGがある。世界最大のスパークリング輸出国。",
 chips:["グレーラ","シャルマ法","フレッシュ","ヴェネト"],map:null},

// ===== スペイン =====
{cat:"スペイン",en:"Spain Overview",ja:"スペインワイン概要",
 def:"生産面積は世界最大。DO/DOCa制度。主要産地：リオハ（DOCa）、リベラ・デル・ドゥエロ（DO）、プリオラート（DOCa）、ヘレス（シェリー）、カヴァ（スパークリング）、リアス・バイシャス。テンプラニーリョが主要品種。",
 chips:["DOCa","テンプラニーリョ","リオハ","面積最大"],map:"spain"},

{cat:"スペイン",en:"Rioja",ja:"リオハ",
 def:"スペイン最名門産地（DOCa）。テンプラニーリョ主体にガルナッチャ等をブレンド。ラベル表示：Crianza（2年/うち樽1年）、Reserva（3年/うち樽1年）、Gran Reserva（5年/うち樽2年）。",
 chips:["テンプラニーリョ","Crianza","Reserva","Gran Reserva"],map:null},

{cat:"スペイン",en:"Sherry (Jerez)",ja:"シェリー（ヘレス）",
 def:"スペイン南部アンダルシア・ヘレス・デ・ラ・フロンテーラのフォーティファイドワイン（酒精強化）。アルバリサ土壌でパロミノ種主体。種類：フィノ（辛口・フロール下）、マンサニーリャ、アモンティリャード、オロロソ、PX（極甘口）。",
 chips:["フォーティファイド","フロール","ソレラシステム","フィノ"],map:null},

{cat:"スペイン",en:"Cava",ja:"カヴァ",
 def:"スペインの瓶内二次発酵スパークリングワイン（DO）。主にカタルーニャ州・ペネデス地区で生産。主要品種：マカベオ、チャレッロ、パレリャーダ。近年カヴァ・デ・パラヘ・カリフィカードが最上位格に。",
 chips:["瓶内二次発酵","カタルーニャ","マカベオ","スペイン式"],map:null},

// ===== ドイツ =====
{cat:"ドイツ",en:"Germany Overview",ja:"ドイツワイン概要",
 def:"高緯度（北緯47〜52度）の冷涼産地。リースリングが銘醸品種。Prädikatswein（プレディカーツワイン）制度が特徴的で収穫時の糖度（Oechsle度）で品質を分類。モーゼル・ラインガウ・ラインヘッセン・ファルツが主要産地。",
 chips:["リースリング","冷涼","Prädikatswein","Oechsle"],map:"germany"},

{cat:"ドイツ",en:"Prädikatswein",ja:"プレディカーツワイン",
 def:"ドイツ最上位の品質カテゴリ。熟度順：Kabinett（カビネット）< Spätlese（シュペートレーゼ）< Auslese（アウスレーゼ）< Beerenauslese（BA）< Eiswein（アイスヴァイン）< Trockenbeerenauslese（TBA）。",
 chips:["Kabinett","Spätlese","TBA","糖度順"],map:"pradikat"},

{cat:"ドイツ",en:"Eiswein",ja:"アイスヴァイン",
 def:"自然に氷結したブドウをそのまま圧搾して造る極甘口ワイン。水分が氷となり残り、糖分・酸・フレーバーが濃縮される。Beerenauslese相当の糖度が必要。カナダのアイスワインと同様の製法。",
 chips:["氷結","濃縮","極甘口","TBAと同格以下"],map:null},

{cat:"ドイツ",en:"Mosel",ja:"モーゼル",
 def:"ドイツ北西部、モーゼル川・ザール川・ルーヴァー川流域の急斜面産地。スレート（板岩）土壌。リースリングの繊細・清澄・ミネラル感あふれるスタイル。アルコール低め（7〜9%）で軽い酸味が際立つ。",
 chips:["スレート","急斜面","リースリング","低アルコール"],map:"germany"},

// ===== ポルトガル =====
{cat:"ポルトガル",en:"Port Wine",ja:"ポートワイン",
 def:"ポルトガル・ドウロ渓谷の酒精強化ワイン。発酵中にブランデー（アグアルデンテ）を加え発酵を止め残糖を残す。種類：Ruby、Tawny、LBV（Late Bottled Vintage）、Vintage Port。ヴィラ・ノバ・デ・ガイアで熟成。",
 chips:["ドウロ","酒精強化","Ruby","Tawny","Vintage"],map:null},

{cat:"ポルトガル",en:"Madeira",ja:"マデイラ",
 def:"大西洋のマデイラ島で造る酒精強化ワイン。独特のエストゥファ（加熱）製法で酸化熟成させる。種類：セルシアル（辛口）、ヴェルデーリョ、ブアル、マルムジー（甘口）。長命なワイン。",
 chips:["エストゥファ","加熱熟成","酸化","マデイラ島"],map:null},

{cat:"ポルトガル",en:"Vinho Verde",ja:"ヴィーニョ・ヴェルデ",
 def:"ポルトガル北西部の若くフレッシュな白ワイン（「緑のワイン」）。低アルコール・高酸・微発泡が特徴。アルバリーニョ（スペイン名）＝アルヴァリーニョが最高品種。",
 chips:["微発泡","低アルコール","アルバリーニョ","フレッシュ"],map:null},

// ===== ハンガリー =====
{cat:"東欧",en:"Tokaji Aszú",ja:"トカイ・アスー",
 def:"ハンガリー・トカイ地方の貴腐甘口ワイン。フルミント主体。貴腐果粒（アスー）をプットニョシュ（puttonyos, 3〜6）単位で甘さを表す。世界三大貴腐ワインの一つ（ソーテルヌ、TBAと並ぶ）。",
 chips:["フルミント","貴腐","プットニョシュ","世界三大"],map:null},

// ===== 新世界 =====
{cat:"新世界",en:"New World Overview",ja:"新世界ワイン概要",
 def:"ヨーロッパ以外のワイン産地の総称。米国・オーストラリア・NZ・チリ・アルゼンチン・南アフリカ等。旧世界より品種名ラベル表示が多い。果実味豊か・新樽使用傾向。近年はテロワール志向も高まる。",

// APP
// ============================================================
const cats = ["すべて", ...Array.from(new Set(ALL_CARDS.map(c=>c.cat)))];
let activeCat="すべて", learnedIds=new Set(), deck=[], deckPos=0, isFlipped=false;

window.onload=()=>{
  buildCatBtns();
  buildDeck();
  renderCard();
};

function buildCatBtns(){
  const wrap=document.getElementById("cat-scroll");
  cats.forEach(cat=>{
    const btn=document.createElement("button");
    btn.className="cat-btn"+(cat===activeCat?" active":"");
    const n=cat==="すべて"?ALL_CARDS.length:ALL_CARDS.filter(c=>c.cat===cat).length;
    btn.textContent=`${cat} (${n})`;
    btn.onclick=()=>selectCat(cat);
    wrap.appendChild(btn);
  });
}

function selectCat(cat){
  activeCat=cat;
  document.querySelectorAll(".cat-btn").forEach((b,i)=>b.classList.toggle("active",cats[i]===cat));
  buildDeck(); renderCard();
}

function buildDeck(){
  deck=ALL_CARDS.map((_,i)=>i)
    .filter(i=>activeCat==="すべて"||ALL_CARDS[i].cat===activeCat)
    .filter(i=>!learnedIds.has(i));
  deckPos=0;
}

function renderCard(){
  const learnedN=activeCat==="すべて"?learnedIds.size:Array.from(learnedIds).filter(i=>ALL_CARDS[i].cat===activeCat).length;
  const totalN=activeCat==="すべて"?ALL_CARDS.length:ALL_CARDS.filter(c=>c.cat===activeCat).length;
  document.getElementById("learned-badge").textContent=`覚えた ${learnedN}枚`;
  document.getElementById("pos-rem").textContent=deck.length;

  const done=document.getElementById("completed-state");
  const wrap=document.getElementById("flip-wrap");
  const nav=document.querySelector(".nav-controls");
  const kbdHint=document.querySelector(".kbd-hint");

  if(deck.length===0){
    wrap.style.display="none"; done.style.display="block";
    nav.style.display="none"; kbdHint.style.display="none";
    document.getElementById("completed-msg").textContent=
      `${activeCat==="すべて"?"全カテゴリ":activeCat}の全${totalN}枚を覚えました！🥂`;
    updProg(totalN,totalN); return;
  }
  wrap.style.display=""; done.style.display="none";
  nav.style.display="flex"; kbdHint.style.display="";

  const idx=deck[deckPos]; const c=ALL_CARDS[idx];
  document.getElementById("pos-cur").textContent=deckPos+1;
  document.getElementById("pos-tot").textContent=deck.length;
  document.getElementById("front-cat").textContent=c.cat;
  document.getElementById("front-en").textContent=c.en;
  document.getElementById("front-ja").textContent=c.ja;
  document.getElementById("back-def").textContent=c.def;

  const chips=document.getElementById("back-chips");
  chips.innerHTML="";
  (c.chips||[]).forEach(ch=>{
    const s=document.createElement("span");
    s.className="kw-chip"; s.textContent=ch; chips.appendChild(s);
  });

  const mapEl=document.getElementById("back-map");
  mapEl.innerHTML=c.map&&SVG[c.map]?SVG[c.map]:"";
  mapEl.style.display=c.map&&SVG[c.map]?"flex":"none";

  document.getElementById("btn-prev").disabled=deckPos===0;
  document.getElementById("btn-next").disabled=deckPos===deck.length-1;

  if(isFlipped)flipCard();
  updProg(learnedN,totalN);
}

function updProg(l,t){
  document.getElementById("prog-fill").style.width=(t===0?100:Math.round(l/t*100))+"%";
}

function flipCard(){
  isFlipped=!isFlipped;
  document.getElementById("flip-inner").classList.toggle("flipped",isFlipped);
}

function navigate(d){
  const np=deckPos+d;
  if(np<0||np>=deck.length)return;
  deckPos=np; isFlipped=false; renderCard();
}

function markLearned(){
  if(!deck.length)return;
  learnedIds.add(deck[deckPos]);
  deck.splice(deckPos,1);
  if(deckPos>=deck.length)deckPos=Math.max(0,deck.length-1);
  isFlipped=false; renderCard();
}

function shuffleDeck(){
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  deckPos=0; isFlipped=false; renderCard();
}

function resetAll(){
  const toReset=activeCat==="すべて"?[...Array(ALL_CARDS.length).keys()]:ALL_CARDS.map((_,i)=>i).filter(i=>ALL_CARDS[i].cat===activeCat);
  toReset.forEach(i=>learnedIds.delete(i));
  buildDeck(); isFlipped=false; renderCard();
}

function resetLearned(){
  learnedIds.clear(); buildDeck(); isFlipped=false; renderCard();
}

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowRight"||e.key==="l"){navigate(1);e.preventDefault();}
  else if(e.key==="ArrowLeft"||e.key==="h"){navigate(-1);e.preventDefault();}
  else if(e.key===" "){flipCard();e.preventDefault();}
  else if(e.key==="Enter"){markLearned();e.preventDefault();}
  else if(e.key==="r"||e.key==="R")resetAll();
  else if(e.key==="s"||e.key==="S")shuffleDeck();
});
</script>
</body>
</html>
